<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#050505" />
  <title>Carta · Admin Rústica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=20260910login" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-top">
      <div class="admin-brand">
        <div>
          <strong>Rústica Admin</strong>
          <span id="user-email">Carta</span>
        </div>
      </div>
      <div class="admin-actions">
        <nav class="admin-nav" aria-label="Secciones admin">
          <a class="is-active" href="carta.html">Carta</a>
          <a href="promociones.html">Promociones</a>
        </nav>
        <a class="btn btn-ghost btn-sm" href="../carta-rustica-napoletana/" target="_blank" rel="noopener">Ver carta</a>
        <button class="btn btn-ghost btn-sm" type="button" id="logout-btn">Salir</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="panel-card">
        <div class="toolbar">
          <div>
            <h1>Carta</h1>
            <p class="lead">Toca un texto para editarlo al momento. Usa «Más» para foto y detalles.</p>
          </div>
          <button class="btn btn-desktop-new" type="button" id="new-item-btn">Nuevo plato</button>
        </div>

        <div class="search-wrap">
          <input id="search-input" type="search" placeholder="Buscar plato, precio o descripción…" autocomplete="off" />
        </div>

        <div class="filter-block">
          <p class="filter-label">Categoría</p>
          <div class="chip-row" id="filter-categories"></div>
        </div>

        <p class="status" id="list-status" role="status"></p>
        <div class="dish-list" id="items-body"></div>
      </section>
    </main>
  </div>

  <button class="btn fab" type="button" id="fab-new" aria-label="Nuevo plato">+ Plato</button>

  <div class="modal-backdrop" id="item-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Plato</h2>
        <button class="btn btn-ghost btn-sm" type="button" id="cancel-btn">Cerrar</button>
      </div>
      <p class="lead" id="modal-lead">Foto, categoría y opciones avanzadas.</p>
      <form id="item-form">
        <input type="hidden" id="item-id" />

        <div class="photo-box">
          <div class="photo-preview is-empty" id="photo-preview">Sin foto</div>
          <div class="photo-actions">
            <label class="btn btn-ghost">
              Añadir / cambiar
              <input id="item-photo-file" type="file" accept="image/*" />
            </label>
            <button class="btn btn-danger" type="button" id="remove-photo-btn">Quitar foto</button>
          </div>
          <label>Ruta / URL
            <input id="item-image" type="text" placeholder="assets/carta/… o URL de Storage" />
          </label>
        </div>

        <div class="row">
          <label>Categoría
            <select id="item-category" required></select>
          </label>
          <label>Precio
            <input id="item-price" type="text" placeholder="12,50€" required />
          </label>
        </div>
        <label>Nombre
          <input id="item-name" type="text" required />
        </label>
        <label>Nota del nombre
          <input id="item-name-note" type="text" placeholder="2 unidades" />
        </label>
        <label>Descripción
          <textarea id="item-description"></textarea>
        </label>
        <div class="row-3">
          <label>Badge
            <select id="item-badge">
              <option value="">Ninguno</option>
              <option value="veggie">Vegetariana</option>
              <option value="spicy">Picante</option>
              <option value="award">Premio</option>
            </select>
          </label>
          <label>Texto badge
            <input id="item-badge-label" type="text" placeholder="Vegetariana" />
          </label>
          <label>Orden
            <input id="item-sort" type="number" step="1" value="0" inputmode="numeric" />
          </label>
        </div>
        <label>Anchor id
          <input id="item-anchor" type="text" placeholder="plato-margarita" />
        </label>
        <label class="check"><input id="item-published" type="checkbox" checked /> Publicado en la web</label>
        <label class="check"><input id="item-signature" type="checkbox" /> Destacado firma (fondo rojo)</label>
        <label class="check"><input id="item-chef" type="checkbox" /> Recomendación del chef</label>
        <label class="check"><input id="item-popular" type="checkbox" /> Pizza popular</label>
        <div class="row">
          <label>Kicker chef
            <input id="item-chef-kicker" type="text" />
          </label>
          <label>Blurb chef
            <input id="item-chef-blurb" type="text" />
          </label>
        </div>
        <div class="row">
          <label>Kicker popular
            <input id="item-pop-kicker" type="text" />
          </label>
          <label>Blurb popular
            <input id="item-pop-blurb" type="text" />
          </label>
        </div>
        <p class="status" id="form-status" role="status"></p>
        <div class="modal-actions">
          <button class="btn btn-danger" type="button" id="delete-btn" hidden>Eliminar</button>
          <button class="btn btn-ghost" type="button" id="cancel-btn-2">Cancelar</button>
          <button class="btn btn-wide" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js?v=20260910a"></script>
  <script src="/js/menu-api.js?v=20260910a"></script>
  <script src="/admin/admin.js?v=20260910d"></script>
</body>
</html>

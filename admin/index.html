<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#050505" />
  <title>Admin · Rústica Napoletana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=20260910login" />
</head>
<body class="login-page">
  <div class="login-stage" aria-hidden="true">
    <div class="login-stage__glow"></div>
    <div class="login-stage__grain"></div>
  </div>

  <main class="login-wrap">
    <section class="login-panel" aria-labelledby="login-title">
      <a class="login-brand" href="/" aria-label="Rústica Napoletana">
        <span class="login-brand__mark" aria-hidden="true"><span>RÚS</span><span>TI</span><span>CA</span></span>
        <span class="login-brand__copy">
          <strong>Rústica Napoletana</strong>
          <small>Panel de gestión</small>
        </span>
      </a>

      <p class="login-kicker">Acceso privado</p>
      <h1 id="login-title">Entra al horno.</h1>
      <p class="login-lead">Gestiona la carta y las promociones con tu cuenta de Rústica.</p>

      <form id="login-form" class="login-form">
        <label class="login-field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="username" required placeholder="tu@email.com" />
        </label>
        <label class="login-field">
          <span>Contraseña</span>
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </label>
        <button class="btn login-submit" type="submit">Acceder <span aria-hidden="true">→</span></button>
        <p class="status" id="login-status" role="status"></p>
      </form>

      <p class="login-foot">
        <a href="/">← Volver a la web</a>
        <a href="/carta-rustica-napoletana/">Ver carta pública</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js?v=20260910a"></script>
  <script src="/js/menu-api.js?v=20260910a"></script>
  <script>
    (async function () {
      const status = document.getElementById("login-status");
      const form = document.getElementById("login-form");

      if (!window.RusticaMenuApi || !RusticaMenuApi.hasConfig()) {
        status.className = "status error";
        status.textContent = "Falta configurar js/supabase-config.js (url y anonKey).";
        form.querySelector("button").disabled = true;
        return;
      }

      let client;
      try {
        client = RusticaMenuApi.createClient();
      } catch (err) {
        status.className = "status error";
        status.textContent = err.message;
        return;
      }

      const { data: { session } } = await client.auth.getSession();
      if (session) {
        location.replace("/admin/carta.html");
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.className = "status";
        status.textContent = "Entrando…";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          status.className = "status error";
          status.textContent = error.message;
          return;
        }
        location.replace("/admin/carta.html");
      });
    })();
  </script>
</body>
</html>
